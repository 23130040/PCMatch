{% load static %}
<!doctype html>
<html lang="vi" data-page="{{ page_name }}" data-section="{{ page_section }}">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>
            {{ page_title }} — PCMatch
        </title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
        <link rel="stylesheet" href="{% static 'css/base.css' %}">
        <link rel="stylesheet" href="{% static 'css/components.css' %}">
        <link rel="stylesheet" href="{% static 'css/pages.css' %}">
        <link rel="stylesheet" href="{% static 'css/production.css' %}">
        <link rel="stylesheet" href="{% static 'css/shop.css' %}">
        {% include 'includes/frontend_config.html' %}
    </head>
    <body class="shop-app sa-app shop-auth-page">
        <main class="shop-auth shop-auth--wide" id="shop-main" tabindex="-1">
            <section class="shop-auth__card">
                <div class="shop-auth__brand">
                    <a class="logo" href="{% url 'home' %}">
                        <strong>
                            PC Match
                        </strong>
                        <em>
                            Kênh bán
                        </em>
                    </a>
                    <h1>
                        {% block heading %}{% endblock %}
                    </h1>
                    <p>
                        {% block subheading %}{% endblock %}
                    </p>
                </div>
                {% for message in messages %}
                <div class="message{% if message.tags == 'error' %} message--error{% endif %}" role="status">
                    {{ message }}
                </div>
                {% endfor %}
                {% block content %}{% endblock %}
            </section>
        </main>
        <script src="{% static 'js/shop-interface.js' %}" defer>
        </script>
    </body>
</html>
