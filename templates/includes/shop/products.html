<template data-shop-template="shop-products-offers-1">
<div class="sa-empty-table">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" width="48" height="48"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6m-6 4h6m-6 4h4"/></svg>
            <h3>Không có sản phẩm</h3>
            <p>Thêm sản phẩm đầu tiên hoặc thay đổi bộ lọc.</p>
            [[offersLink]]
          </div>
</template>

<template data-shop-template="shop-products-offers-2">
<footer class="sa-table-pagination">
          <p>Hiển thị <strong>1 - [[length]]</strong> trên <strong>[[length2]]</strong> bản ghi</p>
          <nav aria-label="Phân trang">
            <button type="button" disabled aria-label="Trang trước">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6" stroke-linecap="round"/></svg>
            </button>
            <span>Trang 1 / 1</span>
            <button type="button" disabled aria-label="Trang sau">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6" stroke-linecap="round"/></svg>
            </button>
          </nav>
        </footer>
</template>

<template data-shop-template="shop-products-offers-3">
<section class="sa-page-heading">
  <div>
    <div class="sa-breadcrumbs">
      <a href="[[dashboardUrl]]">Kênh bán</a>
      <span>/</span>
      <span>Quản lý sản phẩm</span>
    </div>
    <h1>Quản lý sản phẩm</h1>
    <p>Theo dõi sản phẩm shop đang bán, tồn kho và tình trạng bán hàng.</p>
    <div class="sa-pending-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" width="14" height="14"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      <span>[[total]] sản phẩm trong danh mục hiện tại</span>
    </div>
  </div>
  <div class="sa-page-actions">
    [[offersLink]]
  </div>
</section>

<section class="sa-kpi-grid" aria-label="Số liệu sản phẩm">
  <article class="sa-kpi-card sa-kpi-card--blue">
    <h2>Tổng sản phẩm</h2>
    <div class="sa-kpi-value"><strong>[[total2]]</strong><span>sản phẩm</span></div>
    <p>Toàn bộ linh kiện và module đang được đăng bán trên sàn</p>
  </article>
  <article class="sa-kpi-card sa-kpi-card--amber">
    <h2>Hết hàng</h2>
    <div class="sa-kpi-value"><strong>[[outOfStock]]</strong><span>sản phẩm</span></div>
    <p>Sản phẩm hết tồn kho hoặc được đánh dấu hết hàng</p>
  </article>
  <article class="sa-kpi-card sa-kpi-card--sky">
    <h2>Đang bán</h2>
    <div class="sa-kpi-value"><strong>[[selling]]</strong><span>sản phẩm</span></div>
    <p>Sản phẩm đang hoạt động và còn hàng trong kho</p>
  </article>
  <article class="sa-kpi-card sa-kpi-card--rose">
    <h2>Tạm ẩn</h2>
    <div class="sa-kpi-value"><strong>[[hidden]]</strong><span>sản phẩm</span></div>
    <p>Sản phẩm đang được đặt ở trạng thái tạm ẩn</p>
  </article>
</section>

[[isNewContent]]
</template>

<template data-shop-template="shop-products-inventory-1">
<section class="sa-page-heading">
  <div>
    <div class="sa-breadcrumbs"><a href="[[dashboardUrl]]">Kênh bán</a><span>/</span><span>Tồn kho</span></div>
    <h1>Quản lý tồn kho</h1>
    <p>Theo dõi và cập nhật số lượng hàng trong kho.</p>
  </div>
</section>

<section class="sa-kpi-grid">
  <article class="sa-kpi-card sa-kpi-card--blue"><h2>Tổng sản phẩm</h2><div class="sa-kpi-value"><strong>[[length]]</strong><span>sản phẩm</span></div><p>Tổng số sản phẩm đang quản lý</p></article>
  <article class="sa-kpi-card sa-kpi-card--sky"><h2>Tồn ổn định</h2><div class="sa-kpi-value"><strong>[[length2]]</strong><span>sản phẩm</span></div><p>Sản phẩm còn đủ hàng trong kho</p></article>
  <article class="sa-kpi-card sa-kpi-card--amber"><h2>Sắp hết (&le;3)</h2><div class="sa-kpi-value"><strong>[[length3]]</strong><span>sản phẩm</span></div><p>Cần nhập thêm hàng sớm</p></article>
  <article class="sa-kpi-card sa-kpi-card--rose"><h2>Hết hàng</h2><div class="sa-kpi-value"><strong>[[length4]]</strong><span>sản phẩm</span></div><p>Sản phẩm cần nhập hàng ngay</p></article>
</section>

[[lengthContent]]

<div class="sa-table-card sa-table-card--compact">
  <div class="sa-table-toolbar"><h3 style="margin:0;font-size:14px;font-weight:600;">Toàn bộ sản phẩm đang bán</h3></div>
  <div class="table-scroll"><table>
    <thead><tr><th>SẢN PHẨM</th><th>DANH MỤC</th><th>GIÁ</th><th class="center">TỒN</th><th class="center">ĐÃ BÁN</th><th>CẬP NHẬT</th></tr></thead>
    <tbody>
      [[filterRows]]
    </tbody>
  </table></div>
</div>
</template>

<template data-shop-template="shop-products-offers-4">
<option value="[[k]]" [[kContent]]>[[v]]</option>
</template>

<template data-shop-template="shop-products-offers-5">
<tr>
                <td class="checkbox-cell"><input type="checkbox" aria-label="Chọn [[name]]"></td>
                <td>
                  <div class="sa-product-cell">
                    <div class="sa-product-icon">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6m-6 4h6m-6 4h4"/></svg>
                    </div>
                    <div>
                      <strong>[[name2]]</strong>
                      <small>Mã SP: #[[id]]</small>
                    </div>
                  </div>
                </td>
                <td>[[value]]</td>
                <td class="sa-product-price"><strong>[[priceMoney]]</strong></td>
                <td class="center sa-product-number [[stockContent]]">[[stock]]</td>
                <td class="center sa-product-number">[[sold]]</td>
                <td class="center">[[content]]</td>
                <td class="center">
                  <div class="sa-table-actions">
                    [[offersLink]]
                    <button type="button" class="sa-detail-btn [[activeContent]]" data-action="toggle-product" data-id="[[id2]]">[[activeContent2]]</button>
                    <button type="button" class="sa-detail-btn sa-detail-btn--danger" data-action="delete-product" data-id="[[id3]]">Xóa</button>
                  </div>
                </td>
              </tr>
</template>

<template data-shop-template="shop-products-offers-6">
<table>
            <thead><tr>
              <th class="checkbox-cell"><input type="checkbox" aria-label="Chọn tất cả"></th>
              <th>SẢN PHẨM</th>
              <th>DANH MỤC</th>
              <th>GIÁ BÁN</th>
              <th class="center">TỒN KHO</th>
              <th class="center">ĐÃ BÁN</th>
              <th class="center">TRẠNG THÁI</th>
              <th class="center">THAO TÁC</th>
            </tr></thead>
            <tbody>
              [[productsRows]]
            </tbody>
          </table>
</template>

<template data-shop-template="shop-products-offers-7">
<div class="sa-table-card">
  <div class="sa-table-toolbar">
    <div class="sa-table-filters">
      <label class="sa-table-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="sa-search-input" placeholder="Tìm theo tên sản phẩm hoặc thương hiệu..." value="[[get]]">
      </label>
      <select class="sa-filter-select" id="sa-cat-select">
        <option value="">Tất cả danh mục</option>
        [[entriesRows]]
      </select>
    </div>
    <span class="sa-result-count"><strong>[[length]]</strong> sản phẩm khớp bộ lọc</span>
  </div>

  <div class="sa-filter-tabs">
    <button class="sa-tab [[contentContent]]" data-action="sa-filter" data-status="">Tất cả <span>[[allCount]]</span></button>
    <button class="sa-tab [[statusFilterContent]]" data-action="sa-filter" data-status="active">Đang bán <span>[[activeCount]]</span></button>
    <button class="sa-tab [[statusFilterContent2]]" data-action="sa-filter" data-status="out">Hết hàng <span>[[outCount]]</span></button>
    <button class="sa-tab [[statusFilterContent3]]" data-action="sa-filter" data-status="inactive">Tạm ẩn <span>[[hiddenCount]]</span></button>
  </div>

  <div class="table-scroll">
    [[lengthContent]]
  </div>

  [[lengthContent2]]
</div>
</template>

<template data-shop-template="shop-products-_productStatus-2">
