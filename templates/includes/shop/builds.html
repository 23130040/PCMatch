    <strong style="font-size:14px">[[buyerName]]</strong>

      <span>/</span>

<template data-shop-template="shop-builds-buildRequests-5">
<button class="sa-tab [[statusFilterContent]]" data-action="build-tab" data-status="[[s]]">[[s2]] <span>[[c]]</span></button>
</template>

<template data-shop-template="shop-builds-buildRequests-6">
<div style="padding:16px;display:grid;gap:12px">
  [[listRows]]
</div>
</template>

<template data-shop-template="shop-builds-buildRequestDetail-6">
<dl class="info-dl">
  <dt>Khách hàng</dt><dd>[[buyerName]]</dd>
  <dt>Ngân sách</dt><dd>[[budgetMoney]]</dd>
  <dt>Mục đích</dt><dd>[[purpose]]</dd>
  <dt>Yêu cầu thêm</dt><dd>[[notes]]</dd>
  <dt>Trạng thái</dt><dd>[[statusBadge]]</dd>
</dl>
</template>

<template data-shop-template="shop-builds-buildRequestDetail-7">
<div class="shop-slot">
              <div class="shop-slot__code">[[category]]</div>
              <div><strong>[[name]]</strong><small>Qty: [[qty]]</small></div>
              <div>[[priceMoney]]</div>
            </div>
</template>

<template data-shop-template="shop-builds-buildRequestDetail-8">
<div class="shop-slot-grid">
  [[offersRows]]
</div>
<div class="shop-total shop-total--grand"><span>Tổng báo giá</span><strong>[[reduceMoney]]</strong></div>
</template>

<template data-shop-template="shop-builds-buildRequestDetail-9">
<input type="hidden" name="buildId" value="[[id]]">
[[content]]
<div id="proposal-slots">
  [[lengthContent]]
</div>
<div class="cluster">
  [[addProposalSlotButton]]
  [[content2]]
</div>
<input type="hidden" name="slotCount" id="slot-count" value="[[max]]">
</template>

<template data-shop-template="shop-builds-buildRequestDetail-10">
<div class="stack">
            [[statusContent]]
            [[dismissBuildButton]]
          </div>
</template>

<template data-shop-template="shop-builds-renderProposalSlot-1">
<option value="[[id]]" [[idContent]]>[[name]] — [[priceMoney]]</option>
</template>

<template data-shop-template="shop-builds-renderProposalSlot-2">
<div class="shop-slot" data-slot="[[index]]">
    <div class="shop-slot__code">[[index2]]</div>
    <div>
      <label class="field"><span>Sản phẩm</span>
        <select name="model_[[index3]]" required>
          <option value="">-- Chọn sản phẩm --</option>
          [[allModelsRows]]
        </select>
      </label>
      <div class="two-col">
        <label class="field"><span>Giá báo</span><input type="number" name="price_[[index4]]" value="[[price]]" min="1000" step="1000" required></label>
        <label class="field"><span>Số lượng</span><input type="number" name="qty_[[index5]]" value="[[qty]]" min="1" step="1" required></label>
      </div>
    </div>
    <button type="button" class="btn" data-action="remove-proposal-slot" data-id="[[index6]]" aria-label="Xóa dòng">×</button>
  </div>
</template>

<template data-shop-template="shop-builds-proposalList-6">
<div style="padding:16px;display:grid;gap:12px">
  [[requestsRows]]
</div>
</template>
