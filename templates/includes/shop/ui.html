<template data-shop-template="shop-ui-a-1">
<a class="btn btn--[[kind]]" href="[[pUrl]]">[[text]]</a>
</template>

<template data-shop-template="shop-ui-form-1">
<form data-form="[[id]]" class="stack">[[body]]<p class="form-error" role="alert"></p></form>
</template>

<template data-shop-template="shop-ui-btn-1">
<button type="button" class="btn btn--[[kind]]" data-action="[[action]]" data-id="[[data]]">[[text]]</button>
</template>

<template data-shop-template="shop-ui-field-1">
<label class="field"><span>[[label]]</span><input name="[[name]]" type="[[type]]" value="[[value]]" [[attrs]]></label>
</template>

<template data-shop-template="shop-ui-select-1">
<option value="[[k]]" [[kContent]]>[[v]]</option>
</template>

<template data-shop-template="shop-ui-select-2">
<label class="field"><span>[[label]]</span><select name="[[name]]" [[attrs]]>[[entriesRows]]</select></label>
</template>

<template data-shop-template="shop-ui-textarea-1">
<label class="field"><span>[[label]]</span><textarea name="[[name]]" [[attrs]]>[[value]]</textarea></label>
</template>

<template data-shop-template="shop-ui-submit-1">
<button class="btn btn--primary" type="submit">[[text]]</button>
</template>

<template data-shop-template="shop-ui-notice-1">
<div class="message message--[[type]]">[[text]]</div>
</template>

<template data-shop-template="shop-ui-panel-1">
<section class="panel panel--padded"><h2>[[title]]</h2>[[body]]</section>
</template>

<template data-shop-template="shop-ui-badge-1">
<span class="sa-badge sa-badge--[[type]]">[[text]]</span>
</template>
