{% load static shop_templates %}
<!doctype html>
<html lang="vi" data-page="{{ page_name }}" data-section="{{ page_section }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}Kênh bán — PCMatch{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
    <link rel="stylesheet" href="{% static 'css/production.css' %}">
    <link rel="stylesheet" href="{% static 'css/shop.css' %}">
    {% include 'includes/frontend_config.html' %}
</head>
<body class="shop-app sa-app">
    <div id="shop-app-root">{% include 'includes/shop/shell.html' %}</div>
    {% shop_templates 'ui' %}
    {% shop_templates 'app' %}
    {% block shop_templates %}{% endblock %}
    <script type="module" src="{% static 'js/shop.js' %}"></script>
</body>
</html>
