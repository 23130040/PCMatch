{% load static %}
<!doctype html>
<html lang="vi" data-page="{{ page_name }}" data-section="{{ page_section }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quên mật khẩu Kênh người bán</title>
<link rel="stylesheet" href="{% static 'css/tokens.css' %}">
<link rel="stylesheet" href="{% static 'css/base.css' %}">
<link rel="stylesheet" href="{% static 'css/components.css' %}">
<link rel="stylesheet" href="{% static 'css/pages.css' %}">
<link rel="stylesheet" href="{% static 'css/production.css' %}">
<link rel="stylesheet" href="{% static 'css/shop.css' %}">
{% include 'includes/frontend_config.html' %}</head>
<body class="shop-app shop-auth-page">
<a class="skip-link" href="#main">
    Bỏ qua điều hướng
</a>
<div class="service-bar">
    PCMatch · Kênh người bán
</div>
<header class="topbar">
    <div class="container topbar__inner" style="max-width:none">
        <a class="logo" href="/shop/login/">
            <i class="logo__mark">
            </i>
            <span>
                PC
            </span>
            <span>
                Match Shop
            </span>
        </a>
        <nav class="nav-links">
            <a href="/shop/login/">
                Về đăng nhập
            </a>
        </nav>
    </div>
</header>
<main id="main">
    <div class="shop-auth">
        <section class="shop-auth__card" aria-labelledby="shop-forgot-title">
            <div class="shop-auth__brand" id="shop-forgot-title">
                <h1>
                    Quên mật khẩu
                </h1>
                <p>
                    Nhập email gian hàng, liên kết đặt lại demo hiện ngay bên dưới.
                </p>
                <div class="shop-auth__error" data-forgot-error="" hidden="" role="alert">
                </div>
                <section class="shop-auth__form" id="" data-backend-form="pending">
                    <label class="field">
                        <span>
                            Email gian hàng *
                        </span>
                        <input name="email" type="email" autocomplete="email" required="" placeholder="shop@pcmatch.vn">
                    </label>
                    <button class="btn btn--primary shop-auth__submit" type="button" data-forgot-submit="" disabled="">
                        Gửi liên kết đặt lại
                    </button>
                </section>
            </div>
            <footer class="shop-auth__footer">
                <a href="/staff/policies/">
                    Điều khoản
                </a>
                <span aria-hidden="true">
                    ·
                </span>
                <a href="/staff/policies/">
                    Chính sách bảo mật
                </a>
                <span aria-hidden="true">
                    ·
                </span>
                <a href="/staff/support/">
                    Hỗ trợ
                </a>
            </footer>
        </section>
    </div>
</main>
<script src="{% static 'js/shop-interface.js' %}" defer></script>
</body></html>
